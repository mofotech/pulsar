name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Called by release.yml so a release only publishes after the full suite passes.
  workflow_call:

permissions:
  contents: read

jobs:
  # ── Go: lint ────────────────────────────────────────────────────────────────
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  # ── Go: test + build ────────────────────────────────────────────────────────
  go-build:
    name: Go build & test
    runs-on: ubuntu-latest
    services:
      # Integration tests (identity, auth middleware, schema drift) need real
      # Postgres + etcd; same ports as deploy/docker/docker-compose.test.yml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsar
          POSTGRES_PASSWORD: pulsar-test
          POSTGRES_DB: pulsar
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulsar"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PULSAR_TEST_PG_DSN: postgres://pulsar:pulsar-test@127.0.0.1:55432/pulsar?sslmode=disable
      PULSAR_TEST_ETCD: 127.0.0.1:52379
      PULSAR_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Service containers can't take a command, and etcd needs flags.
      - name: Start etcd
        run: |
          docker run -d --name etcd -p 52379:2379 quay.io/coreos/etcd:v3.5.15 \
            etcd --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://127.0.0.1:52379
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:52379/health && exit 0
            sleep 1
          done
          docker logs etcd; exit 1

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Build pulsar (linux/amd64)
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X github.com/agomez/pulsar/internal/version.Version=${VERSION} \
                   -X github.com/agomez/pulsar/internal/version.GitCommit=${GIT_COMMIT} \
                   -X github.com/agomez/pulsar/internal/version.BuildDate=${BUILD_DATE}"
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/pulsar ./cmd/pulsar

      - name: Build pulsarctl (linux/amd64)
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X github.com/agomez/pulsar/internal/version.Version=${VERSION} \
                   -X github.com/agomez/pulsar/internal/version.GitCommit=${GIT_COMMIT} \
                   -X github.com/agomez/pulsar/internal/version.BuildDate=${BUILD_DATE}"
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/pulsarctl ./cmd/pulsarctl

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-binaries-${{ github.sha }}
          path: bin/
          retention-days: 7

  # ── Helm chart: lint, render, schema-validate ─────────────────────────────────
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/kubernetes/helm/pulsar
      KUBECONFORM_VERSION: v0.6.7
      K8S_VERSION: "1.30.0"
      # Throwaway value so the chart renders; the chart requires jwt.secret.
      CI_JWT: ci-only-not-a-real-secret-0123456789abcdef
      ALL_INFRA: infraCompute.enabled=true,infraNetwork.enabled=true,infraStorage.enabled=true
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint --strict "$CHART" --set jwt.secret="$CI_JWT" --set "$ALL_INFRA"

      - name: Render chart variants
        run: |
          mkdir -p rendered
          # Defaults (bundled etcd + Postgres, chart-managed JWT Secret)
          helm template pulsar "$CHART" --set jwt.secret="$CI_JWT" > rendered/default.yaml
          # Every optional component enabled
          helm template pulsar "$CHART" --set jwt.secret="$CI_JWT" --set "$ALL_INFRA" > rendered/all-infra.yaml
          # External etcd/Postgres + pre-existing JWT Secret
          helm template pulsar "$CHART" --set jwt.existingSecret=pulsar-jwt \
            --set etcd.enabled=false,postgres.enabled=false > rendered/external.yaml

      - name: Chart refuses to render without a JWT secret
        run: |
          if helm template pulsar "$CHART" > /dev/null 2>err.txt; then
            echo "::error::chart rendered without jwt.secret / jwt.existingSecret"; exit 1
          fi
          grep -q "jwt.secret is required" err.txt

      - name: kubeconform
        run: kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" rendered/*.yaml

  # ── Release config: snapshot build of .goreleaser.yaml ────────────────────────
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A real release refuses to run on a dirty tree; snapshots don't, so check here.
      - name: Release hooks leave the git tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # ── Web UI: typecheck + build ────────────────────────────────────────────────
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-web-${{ github.sha }}
          path: web/dist/
          retention-days: 7
