---
# Set up LVM thin pool for VM disk storage.
# Skip entirely if lvm_pvs is empty (VG already exists on this node).

- name: Check if volume group already exists
  ansible.builtin.command:
    cmd: vgs --noheadings -o vg_name {{ lvm_volume_group }}
  register: vg_check
  changed_when: false
  failed_when: false

- name: Create LVM physical volumes
  ansible.builtin.command:
    cmd: pvcreate {{ item }}
  loop: "{{ lvm_pvs }}"
  when: vg_check.rc != 0 and lvm_pvs | length > 0

- name: Create LVM volume group
  ansible.builtin.command:
    cmd: vgcreate {{ lvm_volume_group }} {{ lvm_pvs | join(' ') }}
  when: vg_check.rc != 0 and lvm_pvs | length > 0

- name: Check if thin pool already exists
  ansible.builtin.command:
    cmd: lvs --noheadings -o lv_name {{ lvm_volume_group }}/{{ lvm_thin_pool }}
  register: lv_check
  changed_when: false
  failed_when: false

- name: Create LVM thin pool
  ansible.builtin.command:
    cmd: >
      lvcreate --type thin-pool
      -l {{ lvm_pool_size }}
      -n {{ lvm_thin_pool }}
      {{ lvm_volume_group }}
  when: lv_check.rc != 0

- name: Enable tgt (iSCSI target daemon)
  ansible.builtin.service:
    name: tgt
    state: started
    enabled: true
