map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS so container IP changes are picked up dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_controller http://controller:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API and WebSocket console traffic to the controller
    location /v1/ {
        proxy_pass         $upstream_controller;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade (noVNC console); falls back to "close" for plain HTTP
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Proxy health endpoint (used by the controller healthcheck target)
    location /healthz {
        proxy_pass         $upstream_controller;
        proxy_http_version 1.1;
    }

    # SPA fallback: unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
