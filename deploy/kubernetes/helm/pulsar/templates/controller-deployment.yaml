apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulsar.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsar.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "pulsar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pulsar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      {{- include "pulsar.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "pulsar.serviceAccountName" . }}
      {{- with .Values.controller.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "pulsar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["controller", "--config", "/etc/pulsar/pulsar.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            # Inject JWT secret from Kubernetes Secret so it never lands in
            # the ConfigMap. Viper picks this up via AutomaticEnv().
            - name: PULSAR_CONTROLLER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsar.jwtSecretName" . }}
                  key: {{ include "pulsar.jwtSecretKey" . }}
            # Inject full Postgres DSN (includes password) from Secret.
            - name: PULSAR_CONTROLLER_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsar.postgresSecretName" . }}
                  key: postgres-dsn
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/pulsar
              readOnly: true
            - name: image-store
              mountPath: {{ .Values.controller.imageStoreDir }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pulsar.fullname" . }}-config
        - name: image-store
          {{- if .Values.controller.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.controller.persistence.existingClaim | default (printf "%s-image-store" (include "pulsar.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
