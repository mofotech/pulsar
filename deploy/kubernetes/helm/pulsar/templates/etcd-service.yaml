{{- if .Values.etcd.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsar.fullname" . }}-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsar.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  type: ClusterIP
  clusterIP: None  # headless — used by the StatefulSet for stable DNS
  selector:
    {{- include "pulsar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
      protocol: TCP
    - name: peer
      port: 2380
      targetPort: peer
      protocol: TCP
{{- end }}
