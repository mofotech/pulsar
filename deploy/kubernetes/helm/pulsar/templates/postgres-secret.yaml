{{- if .Values.postgres.enabled -}}
{{- if not .Values.postgres.auth.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgres" (include "pulsar.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  # Used by the postgres container (POSTGRES_PASSWORD env var).
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  # Full DSN injected into the controller as PULSAR_CONTROLLER_POSTGRES_DSN.
  postgres-dsn: {{ printf "postgres://%s:%s@%s-postgres/%s?sslmode=disable" .Values.postgres.auth.username .Values.postgres.auth.password (include "pulsar.fullname" .) .Values.postgres.auth.database | quote }}
{{- end }}
{{- else if and (not .Values.postgres.enabled) (not .Values.postgres.external.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgres" (include "pulsar.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  postgres-dsn: {{ .Values.postgres.external.dsn | quote }}
{{- end }}
